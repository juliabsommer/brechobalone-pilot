<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Fundo vinho escuro com bordas arredondadas -->
  <rect width="32" height="32" rx="7" fill="#3d1e20"/>
  <!-- Gancho do cabide -->
  <path d="M16 10C16 7.5 19 6.5 19 8.2C19 9.5 17.2 9.8 16 10.5"
        stroke="#dcb8ba" stroke-width="2" stroke-linecap="round"/>
  <!-- Ombro esquerdo -->
  <line x1="16" y1="11" x2="5" y2="22" stroke="#dcb8ba" stroke-width="2" stroke-linecap="round"/>
  <!-- Ombro direito -->
  <line x1="16" y1="11" x2="27" y2="22" stroke="#dcb8ba" stroke-width="2" stroke-linecap="round"/>
  <!-- Barra inferior do cabide -->
  <line x1="5" y1="22" x2="27" y2="22" stroke="#dcb8ba" stroke-width="2.5" stroke-linecap="round"/>
</svg>
